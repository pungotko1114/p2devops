x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: shortly-db:1.0.0
    build:
      context: ./db
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 512m
    environment:
      POSTGRES_USER: ${DB_USER:-shortly}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-shortly}
    secrets:
      - db_password
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-shortly}", "-d", "${DB_NAME:-shortly}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default_logging


  api:
    image: shortly-api:1.1.0
    build:
      context: ./api
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256m
    secrets:
      - db_password
    environment:
      DB_HOST: ${DB:-db}
      DB_NAME: ${DB_NAME:-shortly}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_USER: ${DB_USER:-shortly}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging: *default_logging

  web:
    image: shortly-web:1.0.0
    build:
      context: ./web
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default_logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
